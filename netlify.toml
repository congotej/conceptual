# Netlify serves the prebuilt site in /dist. Run `python3 build.py` locally (or ask Claude) to regenerate it.
[build]
  publish = "dist"
  command = ""

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Send the Netlify subdomain and www to the main address
[[redirects]]
  from = "https://delightful-cuchufli-bf51cc.netlify.app/*"
  to = "https://conceptualusa.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.conceptualusa.com/*"
  to = "https://conceptualusa.com/:splat"
  status = 301
  force = true
